# Model prices in US dollars per million tokens, used for cost and the
# budget cap. Every entry needs a source and the date it was checked: cost
# is a headline number, so it's never guessed (ADR-005).
#
# Keyed by the full model id, provider included: the same model costs
# different amounts through different providers. To run with your own
# provider, add its entry (e.g. `openai/gpt-5-mini`) with its source;
# without one, only smoke-sized runs are allowed.
#
# cache_read is the price of cached input tokens: the provider's cached
# share of each call's input is charged at it, the rest at `input`. Without
# a cache_read price, cached tokens are charged at `input`. The budget's
# estimate before a run charges every input token at `input`, so it errs
# high.
models:
  openai-api/sumopod/gpt-5-mini:
    input: 0.25
    cache_read: 0.025
    output: 2.00
    source: Sumopod model pricing table (screenshot supplied by Arthur)
    checked: 2026-10-23
  openai-api/sumopod/gpt-5-nano:
    input: 0.05
    cache_read: 0.005
    output: 0.40
    source: Sumopod model pricing table (screenshot supplied by Arthur)
    checked: 2026-10-23
  openai-api/sumopod/gemini/gemini-3.5-flash:
    input: 1.50
    cache_read: 0.15
    output: 9.00
    source: Sumopod model pricing table (screenshot supplied by Arthur)
    checked: 2026-10-25
