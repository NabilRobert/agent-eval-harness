# Model prices in US dollars per million tokens, used for cost and the
# budget cap. Every entry needs a source and the date it was checked: cost
# is a headline number, so it's never guessed (ADR-005).
#
# cache_read is the price of cached input tokens. The harness's own cost
# figure charges every input token at the full `input` price, so it errs
# high, never low, when the provider served some input from cache.
models:
  gpt-5-mini:
    input: 0.25
    cache_read: 0.025
    output: 2.00
    source: Sumopod model pricing table (screenshot supplied by Arthur)
    checked: 2026-10-23
  gpt-5-nano:
    input: 0.05
    cache_read: 0.005
    output: 0.40
    source: Sumopod model pricing table (screenshot supplied by Arthur)
    checked: 2026-10-23
