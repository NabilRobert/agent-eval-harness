  prompt: A film's turnover is its number of rentals divided by its number of copies in the inventory.
    Which 5 films have the highest turnover? If films tie, take titles in alphabetical order. Give the
    title and the turnover, rounded to 2 decimal places.
  reference_sql: select f.title, round(r.n::numeric / c.copies, 2) as turnover from film f join (select
    film_id, count(*) as copies from inventory group by film_id) c on c.film_id = f.film_id join (select
    i.film_id, count(*) as n from rental x join inventory i on i.inventory_id = x.inventory_id group by
    i.film_id) r on r.film_id = f.film_id order by r.n::numeric / c.copies desc, f.title limit 5
  graders:
