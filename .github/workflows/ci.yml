name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install (exact versions from uv.lock)
        # --locked fails if uv.lock no longer matches pyproject.toml; --frozen
        # would install the stale lock without a word.
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Type check (pyright)
        run: uv run --frozen pyright agent_eval/ tests/ scripts/

      - name: Test (pytest)
        run: uv run --frozen pytest -v

      # The gate CI exists for: comparing committed runs needs no API key
      # and no network. (Slice D replaces this self-comparison with
      # baseline-vs-candidate.)
      - name: Committed reports match their records
        run: |
          for run in runs/*/; do uv run --frozen agent-eval report "$run" --check; done

      - name: Published results match the records
        run: uv run --frozen agent-eval publish --check

      - name: Compare committed runs
        run: uv run --frozen agent-eval compare runs/smoke-b1 runs/smoke-b1

  # The VPS image. Built from a checkout where every file is mode 600 (the
  # VPS once had that, and COPY keeps modes), then imported as the
  # non-root run user, so that bug can't come back.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make every tracked file mode 600
        run: git ls-files -z | xargs -0 chmod 600

      - name: Build the harness image
        run: docker build --build-arg HARNESS_GIT="${GITHUB_SHA::12}" -t agent-eval-harness:ci .

      - name: The run user can import the harness and read the suites
        run: |
          docker run --rm --entrypoint python agent-eval-harness:ci -c "
          import os, agent_eval.cli, agent_eval.fs_server
          from pathlib import Path
          assert os.getuid() != 0
          assert Path('/app/suites/filesystem.yaml').read_text()
          assert Path('/app/tools/fs-server/node_modules/@modelcontextprotocol/server-filesystem/dist/index.js').is_file()
          print('ok as uid', os.getuid())"

      - name: The CLI runs (plan only, no keys, no spend)
        run: docker run --rm agent-eval-harness:ci run --suite suites/filesystem.yaml --tasks f01 --epochs 1 --model openai/gpt-5-mini --env-file /dev/null --plan-only
