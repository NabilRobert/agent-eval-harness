[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Regression-gated evaluation of model + MCP server setups, built on Inspect AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Exact pins on purpose: a library update can change agent behaviour or
# Inspect's log format, and either would shift scores silently.
dependencies = [
    "inspect-ai==0.3.283",
    "openai==3.37.0",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.2",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "types-pyyaml==6.0.12.20250915",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.format]
# The fixtures are data the agent reads, fingerprinted byte for byte:
# reformatting them would invalidate every suite and run built on them.
exclude = ["suites/fixtures/**"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["agent_eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
