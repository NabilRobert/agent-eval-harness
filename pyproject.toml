[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Regression-gated evaluation of model + MCP server setups, built on Inspect AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Exact pins on purpose: a library update can change agent behaviour or
# Inspect's log format, and either would shift scores silently.
dependencies = [
    "inspect-ai==0.3.283",
    "openai==3.37.0",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
    "typer==0.27.3",
    # Tracing, off unless an OTLP endpoint is set (ADR-012). The same
    # version as the opentelemetry-api the MCP SDK already brings in.
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = [
    "ruff==0.15.2",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "types-pyyaml==6.0.12.20250915",
]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's defaults, plus the size limits from the "keep it lean" rules: a
# function that crosses one is split, or says why not on its definition.
extend-select = ["C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The fixture's files are written inline, one statement each: splitting
# build() and build_v2() would scatter the data the suite's answers come from.
"scripts/build_filesystem_suite.py" = ["PLR0915"]

[tool.ruff.format]
# The fixtures are data the agent reads, fingerprinted byte for byte:
# reformatting them would invalidate every suite and run built on them.
exclude = ["suites/fixtures/**"]

[tool.pyright]
# The folders CI type-checks, so the editor reports what CI reports.
# repro/ is left out: setup_repro.py runs inside the repro image, where it
# imports MCP-backbone's own scripts (cloned there at a pinned commit), so
# those imports can't resolve in this checkout.
include = ["agent_eval", "tests", "scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Tests import the scripted agents from scripts/ (pytest's pythonpath below).
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.hatch.build.targets.wheel]
packages = ["agent_eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
